version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: rsshub

build:
  toolchains: []
  run_buildscript: false

images:
  - id: rsshub
    target: service
    service: rsshub
    source: docker.io/diygod/rsshub
    channel: date
    sort: semver
    tag_regex: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
    version_regex: '^(?P<version>[0-9]{4})-(?P<month>[0-9]{2})-(?P<day>[0-9]{2})$'
    version_template: '{version}.{month}.{day}'
    max_tags: 50000
    max_matching_tags: 50000
    delivery:
      mode: mirror
      require_digest_match: true
  - id: rsshub-browserless
    target: service
    service: browserless
    source: ghcr.io/browserless/chromium
    channel: stable
    sort: semver
    tag_regex: '^v2\.6\.0$'
    max_tags: 50000
    max_matching_tags: 50000
    delivery:
      mode: mirror
      require_digest_match: true
  - id: rsshub-redis
    target: service
    service: redis
    source: docker.io/library/redis
    channel: stable
    sort: semver
    tag_regex: '^8\.2-alpine$'
    version_regex: '^(?P<version>8\.2)-alpine$'
    version_template: '{version}.0'
    max_tags: 50000
    max_matching_tags: 50000
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: RSSHub
    summary: 万物皆可 RSS，为网站生成订阅源
